<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>

<!-- PWA: 홈 화면에 설치해서 앱처럼 쓸 수 있게 해주는 설정이에요 -->
<link rel="manifest" href="./ledger-manifest.json">
<meta name="theme-color" content="#0f6e56">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --ink: #1a2420;
    --ink-soft: #56635c;
    --ink-faint: #8a958f;
    --paper: #fbfaf7;
    --paper-raised: #ffffff;
    --line: #dcdcd2;
    --line-soft: #ececE4;
    --accent: #0f6e56;
    --accent-soft: #e1f0ea;
    --accent-tint: #f2f8f5;
    --down: #a32d2d;
    --down-soft: #fcebeb;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --cat-0: #2a78d6; --cat-1: #eb6834; --cat-2: #1baf7a; --cat-3: #c98500;
    --cat-4: #d5588a; --cat-5: #008300; --cat-6: #4a3aa7; --cat-7: #e34948;
    --status-good: #0ca30c; --status-warn: #d98300; --status-crit: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .app { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

  .masthead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; row-gap: 10px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
  .masthead h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; flex-shrink: 0; white-space: nowrap; }
  .masthead .sub { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); }
  .masthead-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .backup-actions { display: flex; gap: 6px; }
  .backup-actions .ghost-btn { font-size: 12px; padding: 5px 10px; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 24px; }
  .kpi { background: var(--paper-raised); padding: 14px 16px; }
  .kpi .lbl { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; white-space: nowrap; }
  .kpi .val { font-family: var(--mono); font-size: 18px; font-weight: 600; }
  .kpi .val.income { color: var(--accent); }
  .kpi .val.expense { color: var(--down); }

  .tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-faint); background: none; border: none; padding: 9px 4px; margin-right: 18px; cursor: pointer; border-bottom: 2px solid transparent; position: relative; top: 1px; white-space: nowrap; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--ink-soft); }

  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .toolbar .hint { font-size: 12px; color: var(--ink-faint); }
  .toolbar .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-wrap { flex: 1; max-width: 240px; position: relative; }
  input.search-input { width: 100%; height: 34px; padding: 0 12px 0 30px; font-size: 13px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238a958f" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 8px center; background-size: 14px; }
  input.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  button.primary-btn { font-family: var(--sans); font-size: 13px; font-weight: 500; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 3px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button.primary-btn:hover { background: #000; }
  button.ghost-btn { font-family: var(--sans); font-size: 13px; background: none; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 3px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button.ghost-btn:hover { background: var(--line-soft); }
  button.icon-btn { font-family: var(--sans); font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; padding: 4px 9px; color: var(--ink-soft); margin-left: 4px; }
  button.icon-btn:hover { background: var(--line-soft); color: var(--ink); }
  button.icon-btn.danger { color: var(--down); border-color: var(--down-soft); }
  button.icon-btn.danger:hover { background: var(--down-soft); }
  button.ghost-btn.danger-btn { color: var(--down); border-color: #f0c7c7; }
  button.ghost-btn.danger-btn:hover { background: var(--down-soft); }

  .form-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 16px; }
  .form-card h3 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  .section-heading { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
  input, select, textarea { font-family: var(--sans); font-size: 13px; border: 1px solid var(--line); border-radius: 3px; padding: 0 9px; background: var(--paper); color: var(--ink); width: 100%; }
  input, select { height: 34px; }
  textarea { padding: 9px; min-height: 70px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .form-note { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .field-lbl { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; display: block; }
  .field { margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  tbody td { white-space: nowrap; padding: 10px 8px; border-bottom: 1px solid var(--line-soft); }
  .name-cell { white-space: normal; line-height: 1.35; word-break: keep-all; overflow-wrap: break-word; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--paper); z-index: 4; box-shadow: 0 1px 0 var(--ink); white-space: nowrap; }
  th.num, td.num { text-align: right; font-family: var(--mono); }
  tbody tr:hover { background: var(--accent-tint); }
  .actions-cell { text-align: right; white-space: nowrap; }
  .overflow-x { overflow-x: auto; overflow-y: auto; max-height: 66vh; border-radius: 4px; }
  .empty { text-align: center; padding: 40px 0; color: var(--ink-faint); font-size: 13px; }
  .empty .big { font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; }

  .amt.income { color: var(--accent); font-weight: 600; }
  .amt.expense { color: var(--down); font-weight: 600; }
  .amt.transfer { color: var(--ink-soft); font-weight: 600; }
  .type-tag { font-size: 11px; font-family: var(--mono); font-weight: 600; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .type-tag.income { background: var(--accent-soft); color: var(--accent); }
  .type-tag.expense { background: var(--down-soft); color: var(--down); }
  .type-tag.transfer { background: var(--line-soft); color: var(--ink-soft); }

  .toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { font-family: var(--sans); font-size: 13px; padding: 10px 16px; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 90vw; text-align: center; animation: toast-in 0.2s ease-out; }
  .toast.error { background: #fcebeb; color: #a32d2d; border: 1px solid #f0c7c7; }
  .toast.success { background: var(--accent-soft); color: var(--accent); border: 1px solid #b9dfd0; }
  .toast.info { background: var(--paper-raised); color: var(--ink-soft); border: 1px solid var(--line); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .modal-overlay { position: fixed; inset: 0; background: rgba(26,36,32,0.45); z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  .modal-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 20px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; margin: auto; }
  .modal-card h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 8px; background: var(--paper-raised); border: none; border-right: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink-soft); font-family: var(--sans); }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--ink); color: var(--paper); }
  .seg button.active.expense-active { background: var(--down); }
  .seg button.active.income-active { background: var(--accent); }

  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .month-nav .m-label { font-family: var(--mono); font-size: 14px; font-weight: 600; min-width: 96px; text-align: center; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
  .cal-dow { background: var(--paper); text-align: center; font-size: 11px; color: var(--ink-faint); padding: 6px 0; text-transform: uppercase; }
  .cal-cell { background: var(--paper-raised); min-height: 74px; padding: 6px; cursor: pointer; }
  .cal-cell.empty-cell { background: var(--paper); cursor: default; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell.selected { background: var(--accent-tint); }
  .cal-cell:hover:not(.empty-cell) { background: var(--line-soft); }
  .cal-cell .date-num { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .cal-cell .cal-amt { font-family: var(--mono); font-size: 10.5px; line-height: 1.5; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; }
  .cal-amt.inc { color: var(--accent); }
  .cal-amt.exp { color: var(--down); }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .bar-row .bar-lbl { width: 130px; font-size: 12.5px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar-track { flex: 1; height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .bar-val { width: 130px; text-align: right; font-family: var(--mono); font-size: 12px; flex-shrink: 0; }
  .bar-row .bar-pct { width: 44px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
  .cat-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

  .trend-row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .trend-row .trend-m { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .trend-bars { display: flex; flex-direction: column; gap: 3px; }
  .trend-bar-line { display: flex; align-items: center; gap: 6px; }
  .trend-bar-line .trend-track { flex: 1; height: 9px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .trend-bar-line .trend-fill { height: 100%; border-radius: 3px; }
  .trend-bar-line .trend-fill.inc { background: var(--accent); }
  .trend-bar-line .trend-fill.exp { background: var(--down); }
  .trend-bar-line .trend-num { width: 92px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); flex-shrink: 0; }
  .legend-row { display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }

  .budget-item { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .budget-item .budget-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 8px; }
  .budget-item .budget-head .left { display: flex; align-items: center; gap: 6px; }
  .budget-item .budget-track { height: 10px; background: var(--line-soft); border-radius: 5px; overflow: hidden; }
  .budget-item .budget-fill { height: 100%; border-radius: 5px; }
  .budget-fill.ok { background: var(--status-good); }
  .budget-fill.warn { background: var(--status-warn); }
  .budget-fill.over { background: var(--status-crit); }
  .budget-pct-tag { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; }
  .budget-pct-tag.ok { color: var(--status-good); background: #eaf7ea; }
  .budget-pct-tag.warn { color: var(--status-warn); background: #fbf0e0; }
  .budget-pct-tag.over { color: var(--status-crit); background: var(--down-soft); }
  .budget-edit-input { width: 110px; height: 28px; font-size: 12px; display: inline-block; }

  .acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .acct-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px; }
  .acct-card .acct-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .acct-card .acct-type { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
  .acct-card .acct-bal { font-family: var(--mono); font-size: 17px; font-weight: 600; }
  .acct-card .acct-actions { margin-top: 10px; display: flex; gap: 6px; }
  .acct-card.excluded { opacity: 0.7; }

  .cat-manage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .cat-manage-grid { grid-template-columns: 1fr; } }
  .cat-chip { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; font-size: 13px; }
  .cat-chip .cat-chip-name { display: flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .emoji-pick button { width: 34px; height: 34px; font-size: 16px; border: 1px solid var(--line); background: var(--paper-raised); border-radius: 4px; cursor: pointer; }
  .emoji-pick button.active { border-color: var(--accent); background: var(--accent-soft); }

  .section-block { margin-bottom: 30px; }
  .danger-zone { border: 1px solid #f0c7c7; background: var(--down-soft); border-radius: 5px; padding: 14px 16px; }
  .danger-zone h4 { margin: 0 0 6px; font-size: 13px; color: var(--down); }
  .day-list-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 20px; }

  @media (max-width: 640px) {
    .app { padding: 18px 14px 50px; }
    .bar-row .bar-lbl { width: 96px; }
    .bar-row .bar-val { width: 92px; }
    .trend-bar-line .trend-num { width: 76px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div>
      <h1>가계부</h1>
      <div class="sub" id="masthead-sub">이 기기에만 저장돼요</div>
    </div>
    <div class="masthead-right">
      <div class="backup-actions">
        <button class="ghost-btn" id="btn-export"><i class="ti ti-download"></i> 내보내기</button>
        <button class="ghost-btn" id="btn-import"><i class="ti ti-upload"></i> 가져오기</button>
        <input type="file" id="file-import" accept="application/json" style="display:none">
      </div>
    </div>
  </div>

  <div class="kpi-row" id="kpi-row"></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="home">홈</button>
    <button class="tab" data-tab="calendar">달력</button>
    <button class="tab" data-tab="transactions">내역</button>
    <button class="tab" data-tab="stats">통계</button>
    <button class="tab" data-tab="budget">예산</button>
    <button class="tab" data-tab="accounts">계좌</button>
    <button class="tab" data-tab="recurring">정기거래</button>
    <button class="tab" data-tab="settings">설정</button>
  </div>

  <div class="panel" id="panel-home"></div>
  <div class="panel" id="panel-calendar"></div>
  <div class="panel" id="panel-transactions"></div>
  <div class="panel" id="panel-stats"></div>
  <div class="panel" id="panel-budget"></div>
  <div class="panel" id="panel-accounts"></div>
  <div class="panel" id="panel-recurring"></div>
  <div class="panel" id="panel-settings"></div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<div id="modal-root"></div>

<script>
/* ---------------- storage & data model ---------------- */
const LS_KEY = 'ledger-data-v1';
const CAT_COLORS = ['var(--cat-0)','var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)','var(--cat-7)'];
const EMOJI_CHOICES = ['🍚','☕','🚌','🛒','👗','🧴','🎮','🏠','💊','📚','🎁','🛡️','💳','🚗','✈️','🐾','👨‍👩‍👧','💰','🍺','📦','💵','📈','💸','🎉','🏦','🔄','🛍️','📊'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function defaultData() {
  const categories = [];
  const addCats = (type, list) => { list.forEach(([name, icon], i) => categories.push({ id: uid(), type, name, icon, colorIdx: i % 8 })); };
  addCats('expense', [
    ['식비','🍚'], ['교통','🚌'], ['마트/편의점','🛒'], ['카페/간식','☕'], ['패션/미용','👗'], ['생활용품','🧴'], ['문화생활','🎮'], ['주거/통신','🏠'],
    ['건강/의료','💊'], ['교육','📚'], ['경조사/선물','🎁'], ['보험','🛡️'], ['세금/금융','💳'], ['자동차','🚗'], ['여행','✈️'], ['반려동물','🐾'],
    ['부모님/가족','👨‍👩‍👧'], ['저축/투자','💰'], ['술/유흥','🍺'], ['기타','📦'],
  ]);
  addCats('income', [
    ['급여','💵'], ['부수입','📈'], ['용돈','💸'], ['상여금','🎉'], ['이자/배당','🏦'], ['환급/기타','🔄'], ['판매','🛍️'], ['저축/투자수익','📊'],
  ]);
  const accounts = [{ id: uid(), name: '현금', type: 'cash', icon: '💵', initialBalance: 0, includeInTotal: true }];
  return { version: 1, accounts, categories, transactions: [], budgets: {}, recurring: [] };
}

function loadData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultData();
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.categories) || !Array.isArray(d.accounts)) return defaultData();
    d.transactions = d.transactions || [];
    d.budgets = d.budgets || {};
    d.recurring = d.recurring || [];
    return d;
  } catch (e) { console.error(e); return defaultData(); }
}
function saveData() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
  catch (e) { showToast('저장에 실패했어요. 브라우저 저장공간을 확인해주세요.', 'error'); }
}

let DATA = loadData();
let state = {
  tab: 'home',
  month: monthKey(new Date()),
  calSelected: ymd(new Date()),
  txFilter: { type: 'all', categoryId: '', accountId: '', q: '' },
  statsType: 'expense',
};

/* ---------------- date helpers ---------------- */
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function monthKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function shiftMonth(mKey, delta) {
  const [y, m] = mKey.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function monthLabel(mKey) { const [y, m] = mKey.split('-').map(Number); return `${y}년 ${m}월`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function todayStr() { return ymd(new Date()); }

/* ---------------- formatting ---------------- */
function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function wonSigned(n) { const sign = n < 0 ? '-' : ''; return sign + Math.round(Math.abs(n)).toLocaleString('ko-KR') + '원'; }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getCategory(id) { return DATA.categories.find(c => c.id === id) || { name: '(삭제된 카테고리)', icon: '❔', colorIdx: 0 }; }
function getAccount(id) { return DATA.accounts.find(a => a.id === id) || { name: '(삭제된 계좌)', icon: '❔' }; }
function catColor(cat) { return CAT_COLORS[(cat.colorIdx || 0) % 8]; }

/* ---------------- derived data ---------------- */
function accountBalance(acc) {
  let bal = Number(acc.initialBalance) || 0;
  DATA.transactions.forEach(t => {
    if (t.type === 'income' && t.accountId === acc.id) bal += t.amount;
    else if (t.type === 'expense' && t.accountId === acc.id) bal -= t.amount;
    else if (t.type === 'transfer') {
      if (t.accountId === acc.id) bal -= t.amount;
      if (t.toAccountId === acc.id) bal += t.amount;
    }
  });
  return bal;
}
function totalAssets() {
  return DATA.accounts.filter(a => a.includeInTotal !== false).reduce((s, a) => s + accountBalance(a), 0);
}
function txInMonth(mKey) { return DATA.transactions.filter(t => t.date.slice(0, 7) === mKey); }
function monthSummary(mKey) {
  let income = 0, expense = 0;
  txInMonth(mKey).forEach(t => {
    if (t.excludeFromStats) return;
    if (t.type === 'income') income += t.amount;
    else if (t.type === 'expense') expense += t.amount;
  });
  return { income, expense, net: income - expense };
}
function categoryTotals(mKey, type) {
  const map = {};
  txInMonth(mKey).forEach(t => {
    if (t.type !== type || t.excludeFromStats) return;
    map[t.categoryId] = (map[t.categoryId] || 0) + t.amount;
  });
  return Object.entries(map)
    .map(([categoryId, amount]) => ({ categoryId, amount, category: getCategory(categoryId) }))
    .sort((a, b) => b.amount - a.amount);
}
function categoryUsageCount(catId) { return DATA.transactions.filter(t => t.categoryId === catId).length; }
function accountUsageCount(accId) { return DATA.transactions.filter(t => t.accountId === accId || t.toAccountId === accId).length; }

/* ---------------- toast ---------------- */
function showToast(message, type = 'info', duration = 3800) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, duration);
}

/* ---------------- modal ---------------- */
function openModal(innerHtml) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal-card">${innerHtml}</div></div>`;
  document.getElementById('modal-overlay').addEventListener('mousedown', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function formatAmountInput(el) {
  const digits = el.value.replace(/[^0-9]/g, '');
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}
function rawAmount(el) { return Number(String(el.value).replace(/[^0-9]/g, '')) || 0; }

/* ---------------- tabs / render root ---------------- */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  renderPanel();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (btn) switchTab(btn.dataset.tab);
});

function renderAll() { renderKpis(); renderPanel(); }

function renderKpis() {
  const s = monthSummary(monthKey(new Date()));
  const assets = totalAssets();
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi"><div class="lbl">이번 달 수입</div><div class="val income">${won(s.income)}</div></div>
    <div class="kpi"><div class="lbl">이번 달 지출</div><div class="val expense">${won(s.expense)}</div></div>
    <div class="kpi"><div class="lbl">이번 달 순액</div><div class="val ${s.net >= 0 ? 'income' : 'expense'}">${wonSigned(s.net)}</div></div>
    <div class="kpi"><div class="lbl">총 자산</div><div class="val">${won(assets)}</div></div>
  `;
}

function renderPanel() {
  switch (state.tab) {
    case 'home': renderHome(); break;
    case 'calendar': renderCalendar(); break;
    case 'transactions': renderTransactions(); break;
    case 'stats': renderStats(); break;
    case 'budget': renderBudget(); break;
    case 'accounts': renderAccounts(); break;
    case 'recurring': renderRecurring(); break;
    case 'settings': renderSettings(); break;
  }
}

/* ---------------- HOME ---------------- */
function renderHome() {
  const mKey = monthKey(new Date());
  const recent = [...DATA.transactions].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)).slice(0, 8);
  const topExpense = categoryTotals(mKey, 'expense').slice(0, 5);
  const maxTop = Math.max(1, ...topExpense.map(c => c.amount));

  const budgetAlerts = Object.entries(DATA.budgets)
    .map(([catId, amt]) => ({ catId, amt, spent: (categoryTotals(mKey, 'expense').find(c => c.categoryId === catId) || { amount: 0 }).amount }))
    .filter(b => b.amt > 0 && b.spent / b.amt >= 0.8)
    .sort((a, b) => (b.spent / b.amt) - (a.spent / a.amt));

  document.getElementById('panel-home').innerHTML = `
    <div class="section-block">
      <div class="section-heading">이번 달 지출 top 5</div>
      ${topExpense.length ? topExpense.map(c => `
        <div class="bar-row">
          <div class="bar-lbl"><span class="cat-swatch" style="background:${catColor(c.category)}"></span>${c.category.icon} ${escapeHtml(c.category.name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(c.amount / maxTop * 100).toFixed(1)}%;background:${catColor(c.category)}"></div></div>
          <div class="bar-val">${won(c.amount)}</div>
        </div>`).join('') : `<div class="empty">이번 달 지출 내역이 아직 없어요.</div>`}
    </div>

    ${budgetAlerts.length ? `
    <div class="section-block">
      <div class="section-heading">예산 알림</div>
      ${budgetAlerts.map(b => {
        const cat = getCategory(b.catId);
        const pct = Math.round(b.spent / b.amt * 100);
        const cls = pct >= 100 ? 'over' : 'warn';
        return `<div class="budget-item">
          <div class="budget-head"><span class="left">${cat.icon} ${escapeHtml(cat.name)}</span><span class="budget-pct-tag ${cls}">${pct}%</span></div>
          <div class="budget-track"><div class="budget-fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div class="section-block">
      <div class="section-heading">최근 거래<button class="ghost-btn" onclick="openTxModal()"><i class="ti ti-plus"></i> 거래 추가</button></div>
      ${recent.length ? renderTxTable(recent, false) : `<div class="empty"><div class="big">아직 등록된 거래가 없어요</div>거래 추가 버튼으로 첫 내역을 남겨보세요.</div>`}
    </div>
  `;
}

/* ---------------- month nav (shared) ---------------- */
function monthNavHtml(onPrev, onNext, mKey) {
  return `<div class="month-nav">
    <button class="icon-btn" onclick="${onPrev}"><i class="ti ti-chevron-left"></i></button>
    <div class="m-label">${monthLabel(mKey)}</div>
    <button class="icon-btn" onclick="${onNext}"><i class="ti ti-chevron-right"></i></button>
    <button class="ghost-btn" style="font-size:12px;padding:5px 10px;" onclick="jumpToday()">오늘</button>
  </div>`;
}
function navMonth(delta) {
  state.month = shiftMonth(state.month, delta);
  renderPanel();
}
function jumpToday() {
  state.month = monthKey(new Date());
  state.calSelected = todayStr();
  renderPanel();
}

/* ---------------- CALENDAR ---------------- */
function buildCalendarCells(mKey) {
  const [y, m] = mKey.split('-').map(Number);
  const firstDay = new Date(y, m - 1, 1);
  const startOffset = firstDay.getDay();
  const total = daysInMonth(y, m);
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(`${mKey}-${pad2(d)}`);
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function renderCalendar() {
  const mKey = state.month;
  const cells = buildCalendarCells(mKey);
  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  const today = todayStr();

  const dayTotals = {};
  txInMonth(mKey).forEach(t => {
    if (t.type === 'transfer') return;
    if (!dayTotals[t.date]) dayTotals[t.date] = { income: 0, expense: 0 };
    dayTotals[t.date][t.type] += t.amount;
  });

  const gridHtml = `<div class="cal-grid">
    ${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(date => {
      if (!date) return `<div class="cal-cell empty-cell"></div>`;
      const d = Number(date.slice(-2));
      const totals = dayTotals[date];
      const cls = ['cal-cell'];
      if (date === today) cls.push('today');
      if (date === state.calSelected) cls.push('selected');
      return `<div class="${cls.join(' ')}" onclick="selectCalDate('${date}')">
        <div class="date-num">${d}</div>
        ${totals && totals.income ? `<div class="cal-amt inc">+${abbrevWon(totals.income)}</div>` : ''}
        ${totals && totals.expense ? `<div class="cal-amt exp">-${abbrevWon(totals.expense)}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;

  const dayTx = DATA.transactions.filter(t => t.date === state.calSelected).sort((a, b) => a.id.localeCompare(b.id));
  const dayLabel = state.calSelected.replace(/^\d+-0?/, '').replace('-', '월 ') + '일';

  document.getElementById('panel-calendar').innerHTML = `
    ${monthNavHtml('navMonth(-1)', 'navMonth(1)', mKey)}
    ${gridHtml}
    <div class="day-list-card">
      <div class="section-heading" style="border-bottom:none;margin-bottom:8px;padding-bottom:0;">
        ${escapeHtml(dayLabel)} 내역
        <button class="ghost-btn" onclick="openTxModal(null, '${state.calSelected}')"><i class="ti ti-plus"></i> 이 날짜에 추가</button>
      </div>
      ${dayTx.length ? renderTxTable(dayTx, true) : `<div class="empty">이 날짜에 등록된 거래가 없어요.</div>`}
    </div>
  `;
}
function selectCalDate(date) { state.calSelected = date; renderCalendar(); }
function abbrevWon(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '만';
  return n.toLocaleString('ko-KR');
}

/* ---------------- TRANSACTIONS ---------------- */
function renderTxTable(list, hideDate) {
  return `<div class="overflow-x"><table>
    <thead><tr>
      ${hideDate ? '' : '<th>날짜</th>'}
      <th>구분</th><th>카테고리 / 계좌</th><th class="name-cell">메모</th><th class="num">금액</th><th class="actions-cell">관리</th>
    </tr></thead>
    <tbody>
      ${list.map(t => {
        const acc = getAccount(t.accountId);
        let mid;
        if (t.type === 'transfer') {
          const toAcc = getAccount(t.toAccountId);
          mid = `${acc.icon} ${escapeHtml(acc.name)} <i class="ti ti-arrow-right" style="font-size:11px;"></i> ${toAcc.icon} ${escapeHtml(toAcc.name)}`;
        } else {
          const cat = getCategory(t.categoryId);
          mid = `${cat.icon} ${escapeHtml(cat.name)} <span style="color:var(--ink-faint)">· ${escapeHtml(acc.name)}</span>`;
        }
        const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '';
        return `<tr>
          ${hideDate ? '' : `<td>${t.date.slice(5)}</td>`}
          <td><span class="type-tag ${t.type}">${t.type === 'income' ? '수입' : t.type === 'expense' ? '지출' : '이체'}</span></td>
          <td class="name-cell">${mid}</td>
          <td class="name-cell">${escapeHtml(t.memo || '')}${t.excludeFromStats ? ' <span style="color:var(--ink-faint);font-size:11px;">(통계 제외)</span>' : ''}</td>
          <td class="num amt ${t.type}">${sign}${won(t.amount)}</td>
          <td class="actions-cell">
            <button class="icon-btn" onclick="openTxModal('${t.id}')"><i class="ti ti-pencil"></i></button>
            <button class="icon-btn danger" onclick="deleteTx('${t.id}')"><i class="ti ti-trash"></i></button>
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}

function renderTransactions() {
  const mKey = state.month;
  const f = state.txFilter;
  let list = txInMonth(mKey);
  if (f.type !== 'all') list = list.filter(t => t.type === f.type);
  if (f.categoryId) list = list.filter(t => t.categoryId === f.categoryId);
  if (f.accountId) list = list.filter(t => t.accountId === f.accountId || t.toAccountId === f.accountId);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => (t.memo || '').toLowerCase().includes(q)); }
  list = list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

  const catOptions = DATA.categories
    .filter(c => f.type === 'all' || c.type === f.type)
    .map(c => `<option value="${c.id}" ${f.categoryId === c.id ? 'selected' : ''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('');

  document.getElementById('panel-transactions').innerHTML = `
    ${monthNavHtml('navMonth(-1)', 'navMonth(1)', mKey)}
    <div class="toolbar">
      <div class="btn-group">
        <select id="f-type" style="width:100px;" onchange="onFilterChange()">
          <option value="all" ${f.type === 'all' ? 'selected' : ''}>전체</option>
          <option value="expense" ${f.type === 'expense' ? 'selected' : ''}>지출</option>
          <option value="income" ${f.type === 'income' ? 'selected' : ''}>수입</option>
          <option value="transfer" ${f.type === 'transfer' ? 'selected' : ''}>이체</option>
        </select>
        <select id="f-category" style="width:150px;" onchange="onFilterChange()">
          <option value="">전체 카테고리</option>${catOptions}
        </select>
        <select id="f-account" style="width:130px;" onchange="onFilterChange()">
          <option value="">전체 계좌</option>${DATA.accounts.map(a => `<option value="${a.id}" ${f.accountId === a.id ? 'selected' : ''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('')}
        </select>
      </div>
      <div class="search-wrap">
        <input class="search-input" id="f-q" placeholder="메모 검색" value="${escapeHtml(f.q)}" oninput="onFilterChange()">
      </div>
      <button class="primary-btn" onclick="openTxModal()"><i class="ti ti-plus"></i> 거래 추가</button>
    </div>
    <div class="form-note">${monthLabel(mKey)} · ${list.length}건</div>
    ${list.length ? renderTxTable(list, false) : `<div class="empty"><div class="big">조건에 맞는 거래가 없어요</div>필터를 바꾸거나 새 거래를 추가해보세요.</div>`}
  `;
}
function onFilterChange() {
  state.txFilter.type = document.getElementById('f-type').value;
  state.txFilter.categoryId = document.getElementById('f-category').value;
  state.txFilter.accountId = document.getElementById('f-account').value;
  state.txFilter.q = document.getElementById('f-q').value;
  renderTransactions();
}

function openTxModal(txId, presetDate) {
  const editing = txId ? DATA.transactions.find(t => t.id === txId) : null;
  const type = editing ? editing.type : 'expense';
  const date = editing ? editing.date : (presetDate || todayStr());
  openModal(`
    <h3>${editing ? '거래 수정' : '거래 추가'}</h3>
    <div class="seg" id="tx-type-seg">
      <button type="button" data-v="expense" class="${type === 'expense' ? 'active expense-active' : ''}" onclick="setTxType('expense')">지출</button>
      <button type="button" data-v="income" class="${type === 'income' ? 'active income-active' : ''}" onclick="setTxType('income')">수입</button>
      <button type="button" data-v="transfer" class="${type === 'transfer' ? 'active' : ''}" onclick="setTxType('transfer')">이체</button>
    </div>
    <div class="field"><label class="field-lbl">날짜</label><input type="date" id="tx-date" value="${date}"></div>
    <div class="field"><label class="field-lbl">금액</label><input type="text" inputmode="numeric" id="tx-amount" placeholder="0" oninput="formatAmountInput(this)" value="${editing ? Number(editing.amount).toLocaleString('ko-KR') : ''}"></div>
    <div id="tx-cat-field" class="field"></div>
    <div id="tx-acc-field" class="field"></div>
    <div id="tx-toacc-field" class="field"></div>
    <div class="field"><label class="field-lbl">메모</label><input type="text" id="tx-memo" placeholder="메모 (선택)" value="${escapeHtml(editing ? (editing.memo || '') : '')}"></div>
    <div class="field" id="tx-exclude-field"></div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeModal()">취소</button>
      <button class="primary-btn" onclick="submitTx(${editing ? `'${editing.id}'` : 'null'})">${editing ? '저장' : '추가'}</button>
    </div>
  `);
  state._txModal = { type, editing };
  renderTxModalFields(editing ? editing.categoryId : null, editing ? editing.accountId : null, editing ? editing.toAccountId : null, editing ? !!editing.excludeFromStats : false);
}
function setTxType(t) {
  state._txModal.type = t;
  document.querySelectorAll('#tx-type-seg button').forEach(b => {
    const active = b.dataset.v === t;
    b.classList.toggle('active', active);
    b.classList.toggle('expense-active', active && t === 'expense');
    b.classList.toggle('income-active', active && t === 'income');
  });
  renderTxModalFields();
}
function renderTxModalFields(presetCat, presetAcc, presetToAcc, presetExclude) {
  const type = state._txModal.type;
  const catField = document.getElementById('tx-cat-field');
  const accField = document.getElementById('tx-acc-field');
  const toAccField = document.getElementById('tx-toacc-field');
  const excludeField = document.getElementById('tx-exclude-field');
  if (type === 'transfer') {
    catField.innerHTML = '';
    accField.innerHTML = `<label class="field-lbl">출금 계좌</label><select id="tx-account">${DATA.accounts.map(a => `<option value="${a.id}" ${presetAcc === a.id ? 'selected' : ''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('')}</select>`;
    toAccField.innerHTML = `<label class="field-lbl">입금 계좌</label><select id="tx-toaccount">${DATA.accounts.map(a => `<option value="${a.id}" ${presetToAcc === a.id ? 'selected' : ''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('')}</select>`;
    excludeField.innerHTML = '';
  } else {
    const cats = DATA.categories.filter(c => c.type === type);
    catField.innerHTML = `<label class="field-lbl">카테고리</label><select id="tx-category">${cats.map(c => `<option value="${c.id}" ${presetCat === c.id ? 'selected' : ''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}</select>`;
    accField.innerHTML = `<label class="field-lbl">${type === 'income' ? '입금 계좌' : '지출 계좌'}</label><select id="tx-account">${DATA.accounts.map(a => `<option value="${a.id}" ${presetAcc === a.id ? 'selected' : ''}>${a.icon} ${escapeHtml(a.name)}</option>`).join('')}</select>`;
    toAccField.innerHTML = '';
    excludeField.innerHTML = `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);"><input type="checkbox" id="tx-exclude" style="width:15px;height:15px;" ${presetExclude ? 'checked' : ''}> 통계/예산 계산에서 제외 (예: 환급받은 금액)</label>`;
  }
}
function submitTx(editId) {
  const type = state._txModal.type;
  const date = document.getElementById('tx-date').value;
  const amount = rawAmount(document.getElementById('tx-amount'));
  const memo = document.getElementById('tx-memo').value.trim();
  if (!date) return showToast('날짜를 선택해주세요.', 'error');
  if (!amount || amount <= 0) return showToast('금액을 입력해주세요.', 'error');

  let payload = { type, date, amount, memo };
  if (type === 'transfer') {
    const accountId = document.getElementById('tx-account').value;
    const toAccountId = document.getElementById('tx-toaccount').value;
    if (!accountId || !toAccountId) return showToast('계좌를 선택해주세요.', 'error');
    if (accountId === toAccountId) return showToast('출금 계좌와 입금 계좌가 같을 수 없어요.', 'error');
    payload.accountId = accountId; payload.toAccountId = toAccountId;
  } else {
    const categoryId = document.getElementById('tx-category').value;
    const accountId = document.getElementById('tx-account').value;
    if (!categoryId) return showToast('카테고리가 없어요. 설정에서 먼저 추가해주세요.', 'error');

    payload.categoryId = categoryId; payload.accountId = accountId;
    payload.excludeFromStats = document.getElementById('tx-exclude').checked;
  }

  if (editId) {
    const idx = DATA.transactions.findIndex(t => t.id === editId);

  } else {
    payload.id = uid();
    DATA.transactions.push(payload);
  }
  saveData();
  closeModal();
  showToast(editId ? '거래를 수정했어요.' : '거래를 추가했어요.', 'success');
  renderAll();
}
function deleteTx(id) {

}

  const trend = months.map(m => ({ m, ...monthSummary(m) }));
  const trendMax = Math.max(1, ...trend.map(t => Math.max(t.income, t.expense)));

  document.getElementById('panel-stats').innerHTML = `
    ${monthNavHtml('navMonth(-1)', 'navMonth(1)', mKey)}

        </div>

      ${totals.length ? totals.map(c => `
        <div class="bar-row">
          <div class="bar-lbl"><span class="cat-swatch" style="background:${catColor(c.category)}"></span>${c.category.icon} ${escapeHtml(c.category.name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(c.amount / max * 100).toFixed(1)}%;background:${catColor(c.category)}"></div></div>
          <div class="bar-pct">${sum ? Math.round(c.amount / sum * 100) : 0}%</div>
          <div class="bar-val">${won(c.amount)}</div>
        </div>`).join('') : `<div class="empty">해당 월 데이터가 없어요.</div>`}

            <div class="trend-bar-line"><div class="trend-track"><div class="trend-fill inc" style="width:${(t.income / trendMax * 100).toFixed(1)}%"></div></div><div class="trend-num">${won(t.income)}</div></div>

  `;

/* ---------------- BUDGET ---------------- */
function renderBudget() {
  const mKey = state.month;
  const totals = categoryTotals(mKey, 'expense');
  const spentMap = Object.fromEntries(totals.map(c => [c.categoryId, c.amount]));
  const expenseCats = DATA.categories.filter(c => c.type === 'expense');

  const budgeted = expenseCats.filter(c => (DATA.budgets[c.id] || 0) > 0);
  const unbudgetedSpent = expenseCats.filter(c => !(DATA.budgets[c.id] > 0) && spentMap[c.id]);

  const totalBudget = budgeted.reduce((s, c) => s + (DATA.budgets[c.id] || 0), 0);
  const totalSpent = budgeted.reduce((s, c) => s + (spentMap[c.id] || 0), 0);

  const rowHtml = (cat, spent, budget) => {
    const pct = budget ? Math.round(spent / budget * 100) : 0;
    const cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : 'ok';
    return `<div class="budget-item">
      <div class="budget-head">
        <span class="left">${cat.icon} ${escapeHtml(cat.name)}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="budget-pct-tag ${cls}">${pct}%</span>
          <input type="text" class="budget-edit-input" inputmode="numeric" value="${budget ? budget.toLocaleString('ko-KR') : ''}" placeholder="예산 없음" oninput="formatAmountInput(this)" onchange="setBudget('${cat.id}', this)">
        </span>
      </div>
      <div class="budget-track"><div class="budget-fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div>
      <div class="form-note" style="margin:6px 0 0;">${won(spent)} 사용 ${budget ? ' / ' + won(budget) + ' · 남은 ' + wonSigned(budget - spent) : ''}</div>
    </div>`;
  };

  document.getElementById('panel-budget').innerHTML = `
    ${monthNavHtml('navMonth(-1)', 'navMonth(1)', mKey)}
    <div class="kpi-row" style="margin-bottom:20px;">
      <div class="kpi"><div class="lbl">총 예산</div><div class="val">${won(totalBudget)}</div></div>
      <div class="kpi"><div class="lbl">총 지출</div><div class="val expense">${won(totalSpent)}</div></div>
      <div class="kpi"><div class="lbl">남은 예산</div><div class="val ${totalBudget - totalSpent >= 0 ? 'income' : 'expense'}">${wonSigned(totalBudget - totalSpent)}</div></div>
    </div>
    <div class="section-block">
      <div class="section-heading">예산 설정된 카테고리</div>
      ${budgeted.length ? budgeted.map(c => rowHtml(c, spentMap[c.id] || 0, DATA.budgets[c.id])).join('') : `<div class="empty">아직 예산을 설정하지 않았어요. 아래 목록에서 금액을 입력해보세요.</div>`}
    </div>
    <div class="section-block">
      <div class="section-heading">예산 미설정 카테고리</div>
      ${expenseCats.filter(c => !(DATA.budgets[c.id] > 0)).map(c => rowHtml(c, spentMap[c.id] || 0, 0)).join('')}
    </div>
  `;
}
function setBudget(catId, el) {
  const val = rawAmount(el);
  if (val > 0) DATA.budgets[catId] = val; else delete DATA.budgets[catId];

  renderBudget();
}

function submitRecurring(editId) {
  const type = state._recModal.type;
  const name = document.getElementById('rec-name').value.trim();
  const amount = rawAmount(document.getElementById('rec-amount'));
  const day = Math.min(31, Math.max(1, Number(document.getElementById('rec-day').value) || 1));
  if (!name) return showToast('이름을 입력해주세요.', 'error');
  if (!amount || amount <= 0) return showToast('금액을 입력해주세요.', 'error');

  let payload = { type, name, amount, day };
  if (type === 'transfer') {
    payload.accountId = document.getElementById('rec-account').value;
    payload.toAccountId = document.getElementById('rec-toaccount').value;
    if (payload.accountId === payload.toAccountId) return showToast('출금/입금 계좌가 같을 수 없어요.', 'error');
  } else {
    payload.categoryId = document.getElementById('rec-category').value;
    payload.accountId = document.getElementById('rec-account').value;
  }
  if (editId) {
    const idx = DATA.recurring.findIndex(r => r.id === editId);
    DATA.recurring[idx] = { ...DATA.recurring[idx], ...payload };
  } else {
    payload.id = uid(); payload.active = true;
    DATA.recurring.push(payload);
  }
  saveData();
  closeModal();
  showToast(editId ? '정기거래를 수정했어요.' : '정기거래를 추가했어요.', 'success');
  renderAll();
}
function toggleRecurring(id, active) {
  const r = DATA.recurring.find(x => x.id === id);
  r.active = active;
  saveData();
}
function deleteRecurring(id) {
  if (!confirm('이 정기거래를 삭제할까요? (이미 생성된 거래는 남아있어요)')) return;
  DATA.recurring = DATA.recurring.filter(r => r.id !== id);
  saveData();
  renderRecurring();
}
function applyDueRecurring(force) {
  const today = new Date();
  const mKey = monthKey(today);
  let created = 0;
  DATA.recurring.filter(r => r.active).forEach(r => {
    const already = DATA.transactions.some(t => t.fromRecurringId === r.id && t.date.slice(0, 7) === mKey);
    if (already) return;
    if (!force && r.day > today.getDate()) return;
    const [y, m] = mKey.split('-').map(Number);
    const day = Math.min(r.day, daysInMonth(y, m));
    const date = `${mKey}-${pad2(day)}`;
    DATA.transactions.push({
      id: uid(), date, type: r.type, amount: r.amount, memo: r.name, fromRecurringId: r.id,
      categoryId: r.categoryId, accountId: r.accountId, toAccountId: r.toAccountId,
    });
    created++;
  });
  if (created > 0) { saveData(); showToast(`정기거래 ${created}건이 등록됐어요.`, 'success'); renderAll(); }
  else if (force) { showToast('이번 달에 새로 등록할 정기거래가 없어요.', 'info'); }
}

    <div class="section-block">
      <div class="section-heading">데이터</div>
      <div class="form-note">현재 이 브라우저에만 저장돼요 (거래 ${DATA.transactions.length}건, 계좌 ${DATA.accounts.length}개). 다른 기기로 옮기려면 내보내기 → 가져오기를 사용하세요.</div>
      <div class="danger-zone">
        <h4>전체 초기화</h4>
        <div class="form-note" style="margin-bottom:10px;">모든 거래·계좌·카테고리·예산·정기거래가 삭제되고 기본값으로 돌아가요. 되돌릴 수 없어요.</div>
        <button class="ghost-btn danger-btn" onclick="resetAllData()"><i class="ti ti-alert-triangle"></i> 전체 초기화</button>
      </div>
    </div>
  `;
}
function openCategoryModal(id) {
  const editing = id ? DATA.categories.find(c => c.id === id) : null;
  const type = editing ? editing.type : 'expense';
  const icon = editing ? editing.icon : '📦';
  openModal(`
    <h3>${editing ? '카테고리 수정' : '카테고리 추가'}</h3>
    ${editing ? '' : `<div class="seg" id="cat-type-seg">
      <button type="button" data-v="expense" class="active expense-active" onclick="setCatType('expense')">지출</button>
      <button type="button" data-v="income" onclick="setCatType('income')">수입</button>
    </div>`}
    <div class="field"><label class="field-lbl">이름</label><input type="text" id="cat-name" value="${escapeHtml(editing ? editing.name : '')}" placeholder="카테고리 이름"></div>
    <div class="field"><label class="field-lbl">아이콘</label>
      <div class="emoji-pick" id="emoji-pick">${EMOJI_CHOICES.map(e => `<button type="button" class="${e === icon ? 'active' : ''}" onclick="pickEmoji('${e}', this)">${e}</button>`).join('')}</div>
      <input type="text" id="cat-icon" value="${escapeHtml(icon)}" maxlength="4" style="width:70px;">
    </div>
    <div class="form-actions">
      <button class="ghost-btn" onclick="closeModal()">취소</button>
      <button class="primary-btn" onclick="submitCategory(${editing ? `'${editing.id}'` : 'null'})">${editing ? '저장' : '추가'}</button>
    </div>
  `);
  state._catModal = { type };
}
function setCatType(t) {
  state._catModal.type = t;
  document.querySelectorAll('#cat-type-seg button').forEach(b => {
    const active = b.dataset.v === t;
    b.classList.toggle('active', active);
    b.classList.toggle('expense-active', active && t === 'expense');
    b.classList.toggle('income-active', active && t === 'income');
  });
}
function pickEmoji(e, btn) {
  document.getElementById('cat-icon').value = e;
  document.querySelectorAll('#emoji-pick button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function submitCategory(editId) {
  const name = document.getElementById('cat-name').value.trim();
  const icon = document.getElementById('cat-icon').value.trim() || '📦';
  if (!name) return showToast('카테고리 이름을 입력해주세요.', 'error');
  if (editId) {
    const cat = DATA.categories.find(c => c.id === editId);
    Object.assign(cat, { name, icon });
  } else {
    const type = state._catModal.type;
    const sameType = DATA.categories.filter(c => c.type === type);
    const colorIdx = sameType.length % 8;
    DATA.categories.push({ id: uid(), type, name, icon, colorIdx });
  }
  saveData();
  closeModal();
  showToast(editId ? '카테고리를 수정했어요.' : '카테고리를 추가했어요.', 'success');
  renderSettings();
}
function deleteCategory(id) {
  const used = categoryUsageCount(id);
  if (used > 0) return showToast(`이 카테고리를 사용하는 거래가 ${used}건 있어 삭제할 수 없어요.`, 'error');
  if (!confirm('이 카테고리를 삭제할까요?')) return;
  DATA.categories = DATA.categories.filter(c => c.id !== id);
  delete DATA.budgets[id];
  saveData();
  showToast('삭제했어요.', 'info');
  renderSettings();
}
function resetAllData() {
  if (!confirm('정말로 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.')) return;
  if (!confirm('한 번 더 확인할게요. 정말 전체 초기화하시겠어요?')) return;
  DATA = defaultData();
  saveData();
  showToast('초기화했어요.', 'info');
  renderAll();
}

/* ---------------- backup: export / import ---------------- */
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = todayStr();
  a.href = url; a.download = `가계부-백업-${today}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('백업 파일을 내려받았어요.', 'success');
});
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.categories) || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) throw new Error('invalid');
      if (!confirm('가져오기를 하면 현재 데이터를 덮어써요. 계속할까요?')) return;
      DATA = { version: 1, accounts: parsed.accounts, categories: parsed.categories, transactions: parsed.transactions, budgets: parsed.budgets || {}, recurring: parsed.recurring || [] };
      saveData();
      showToast('데이터를 가져왔어요.', 'success');
      renderAll();
    } catch (err) {
      showToast('올바른 백업 파일이 아니에요.', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------------- init ---------------- */
switchTab('home');
applyDueRecurring(false);
renderAll();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./ledger-sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
